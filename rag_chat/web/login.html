<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · RAG Chat</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="flex min-h-full items-center justify-center bg-neutral-50 px-4 py-10">

  <div class="w-full max-w-[380px]">
    <div class="mb-8 text-center">
      <div class="mb-3 text-[26px] font-bold tracking-tight text-blue-600">RAG Chat</div>
      <p class="text-[13px] text-neutral-400">校园知识库智能问答</p>
    </div>

    <div class="rounded-2xl border border-neutral-200 bg-white p-7 shadow-sm">
      <h1 id="formTitle" class="mb-6 text-[18px] font-semibold text-neutral-900">登录</h1>

      <form id="authForm" class="space-y-4" novalidate>
        <div>
          <label for="username" class="mb-1.5 block text-[13px] font-medium text-neutral-600">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" spellcheck="false"
            placeholder="2-10 个英文字母"
            class="w-full rounded-xl border border-neutral-200 bg-white px-3.5 py-2.5 text-[14px] text-neutral-900 outline-none transition placeholder:text-neutral-300 focus:border-blue-400 focus:ring-2 focus:ring-blue-100">
        </div>

        <div>
          <label for="password" class="mb-1.5 block text-[13px] font-medium text-neutral-600">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
            placeholder="至少 8 位"
            class="w-full rounded-xl border border-neutral-200 bg-white px-3.5 py-2.5 text-[14px] text-neutral-900 outline-none transition placeholder:text-neutral-300 focus:border-blue-400 focus:ring-2 focus:ring-blue-100">
        </div>

        <div id="inviteRow" class="hidden">
          <label for="inviteCode" class="mb-1.5 block text-[13px] font-medium text-neutral-600">邀请码</label>
          <input id="inviteCode" name="inviteCode" type="text" autocomplete="off"
            placeholder="请输入邀请码"
            class="w-full rounded-xl border border-neutral-200 bg-white px-3.5 py-2.5 text-[14px] text-neutral-900 outline-none transition placeholder:text-neutral-300 focus:border-blue-400 focus:ring-2 focus:ring-blue-100">
        </div>

        <p id="errorMsg" class="hidden rounded-lg bg-red-50 px-3 py-2 text-[12px] leading-relaxed text-red-600"></p>

        <button id="submitBtn" type="submit"
          class="w-full rounded-xl bg-neutral-900 py-2.5 text-[14px] font-medium text-white transition hover:bg-neutral-700 disabled:cursor-not-allowed disabled:opacity-50">
          登录
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-[13px] text-neutral-400">
      <span id="switchHint">还没有账号？</span>
      <a id="switchLink" href="#" class="font-medium text-blue-600 hover:underline">立即注册</a>
    </p>
  </div>

  <script type="module" src="/static/js/login.js"></script>
</body>
</html>
