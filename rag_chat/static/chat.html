<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Chat - AI 智能知识库问答</title>
<style>
  :root {
    --bg: #1a1a2e; --sidebar-bg: #0d1117; --card: #161b22;
    --accent: #e94560; --text: #eee; --text-dim: #8b949e;
    --user-bubble: #1f2937; --ai-bubble: #0d1117;
    --input-bg: #161b22; --border: #30363d;
    --success: #3fb950; --warn: #d2991d;
    --hover: #1c2128;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; overflow: hidden;
  }

  /* ════ 侧边栏 ════ */
  .sidebar {
    width: 280px; background: var(--sidebar-bg);
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border); flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border);
  }
  .sidebar-header h2 { font-size: 16px; color: var(--accent); margin-bottom: 12px; }

  .sidebar-header label { font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .sidebar-header input[type="text"],
  .sidebar-header input[type="password"] {
    padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; outline: none;
    transition: border .2s;
  }
  .sidebar-header input:focus { border-color: var(--accent); }
  .remember-row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); margin-top:2px; }
  .remember-row input[type="checkbox"] { width:auto; margin:0; }
  .saved-hint { font-size:10px; color:var(--success); display:none; }

  /* 新建对话按钮 */
  .new-chat-btn {
    margin: 12px 16px; padding: 10px;
    border-radius: 8px; border: 1px dashed var(--border);
    background: transparent; color: var(--text-dim);
    font-size: 13px; cursor: pointer;
    transition: all .2s; text-align: center;
  }
  .new-chat-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 对话列表 */
  .chat-list {
    flex: 1; overflow-y: auto; padding: 0 8px 8px;
  }
  .chat-list .section-title {
    font-size: 11px; color: var(--text-dim); padding: 8px 8px 4px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .chat-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 13px; display: flex; align-items: center; gap: 8px;
    transition: background .15s; margin-bottom: 2px;
  }
  .chat-item:hover { background: var(--hover); }
  .chat-item.active { background: var(--card); }
  .chat-item .icon { font-size: 14px; flex-shrink: 0; }
  .chat-item .info { flex:1; min-width:0; }
  .chat-item .title { white-space: nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item .time { font-size: 10px; color: var(--text-dim); }
  .chat-item .delete-btn {
    opacity:0; font-size:12px; color:var(--text-dim); cursor:pointer;
    flex-shrink:0; padding:2px 4px; border-radius:4px;
  }
  .chat-item:hover .delete-btn { opacity: 1; }
  .chat-item .delete-btn:hover { color: var(--accent); background: rgba(233,69,96,.1); }

  .no-chats { text-align:center; color:var(--text-dim); font-size:12px; padding:20px; }

  /* 底部状态 */
  .sidebar-footer {
    padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px;
  }
  .status { padding:6px 10px; border-radius:6px; text-align:center; }
  .status.on { background:#003d1a; color:var(--success); }
  .status.off { background:#3d0000; color:var(--accent); }

  /* ════ 主聊天区 ════ */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }

  .header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .header h1 { font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header .badge {
    font-size:10px; padding:3px 8px; border-radius:10px;
    background:var(--card); color:var(--accent); white-space:nowrap;
  }

  /* 消息区 */
  .messages {
    flex:1; overflow-y:auto; padding:20px;
    display:flex; flex-direction:column; gap:14px;
  }
  .msg { display:flex; gap:8px; max-width:82%; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg.ai  { align-self:flex-start; }

  .avatar {
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0;
  }
  .msg.user .avatar { background:var(--accent); }
  .msg.ai .avatar { background:var(--card); }

  .bubble {
    padding:10px 14px; border-radius:12px; line-height:1.6;
    font-size:14px; white-space:pre-wrap; word-break:break-word;
  }
  .msg.user .bubble { background:var(--user-bubble); border-bottom-right-radius:4px; }
  .msg.ai .bubble { background:var(--ai-bubble); border-bottom-left-radius:4px; border:1px solid var(--border); }

  .sources {
    margin-top:6px; padding:6px 10px; background:var(--sidebar-bg);
    border-radius:6px; font-size:11px; color:var(--text-dim);
  }
  .sources .src-title { color:var(--accent); font-weight:600; margin-bottom:2px; font-size:11px; }
  .sources .src-item { padding:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-bottom:1px solid var(--border); }
  .sources .src-item:last-child { border-bottom:none; }
  .sources .src-dist { font-size:10px; color:var(--warn); margin-left:4px; }

  /* 输入区 */
  .input-area {
    padding:14px 20px; border-top:1px solid var(--border);
    display:flex; gap:10px; align-items:flex-end; flex-shrink:0;
  }
  .input-area textarea {
    flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--input-bg); color:var(--text); font-size:14px;
    resize:none; outline:none; min-height:44px; max-height:120px;
    font-family:inherit; transition:border .2s;
  }
  .input-area textarea:focus { border-color:var(--accent); }
  .input-area button {
    padding:10px 20px; border-radius:10px; border:none;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600;
    cursor:pointer; transition:opacity .2s,transform .1s; white-space:nowrap;
  }
  .input-area button:hover { opacity:.9; }
  .input-area button:active { transform:scale(.97); }
  .input-area button:disabled { opacity:.4; cursor:not-allowed; }

  /* 上传区域 */
  .upload-area {
    margin: 12px 16px; padding: 10px 12px;
    background: var(--card); border-radius: 8px;
    border: 1px dashed var(--border); cursor: pointer;
    text-align: center; font-size: 12px; color: var(--text-dim);
    transition: all .2s;
  }
  .upload-area:hover { border-color: var(--accent); color: var(--accent); }
  .upload-area.uploading { opacity: .6; pointer-events: none; }
  .upload-area .upload-icon { font-size: 20px; display: block; margin-bottom: 2px; }
  .upload-area input[type="file"] { display: none; }
  .upload-status {
    font-size: 10px; margin: 4px 16px 0; padding: 4px 8px; border-radius: 4px;
    display: none; text-align: center;
  }
  .upload-status.success { display:block; background: #003d1a; color: var(--success); }
  .upload-status.error { display:block; background: #3d0000; color: var(--accent); }
  .upload-status.loading { display:block; background: #1a1a00; color: var(--warn); }

  .messages::-webkit-scrollbar,
  .chat-list::-webkit-scrollbar { width:5px; }
  .messages::-webkit-scrollbar-track,
  .chat-list::-webkit-scrollbar-track { background:transparent; }
  .messages::-webkit-scrollbar-thumb,
  .chat-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  @media (max-width: 700px) {
    .sidebar { display:none; }
    .msg { max-width:95%; }
  }
</style>
</head>
<body>

<!-- ════ 侧边栏 ════ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h2>⚡ RAG Chat</h2>

    <label>🔑 API Key
      <input type="password" id="apiKey" placeholder="输入 X-API-Key…" autocomplete="off">
      <span class="remember-row">
        <input type="checkbox" id="rememberKey"> 记住 API Key
        <a href="#" id="forgetKey" style="display:none;color:var(--accent);margin-left:auto;">清除</a>
      </span>
      <span class="saved-hint" id="keySavedHint">已从本地加载</span>
    </label>

    <label>👤 用户 ID
      <input type="text" id="userId" placeholder="zhangsan" value="zhangsan">
    </label>

    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <span class="upload-icon">📁</span>
      上传文档到知识库<br>
      <span style="font-size:10px;color:var(--text-dim)">支持 .txt / .md / .pdf / .docx</span>
      <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx" onchange="onFileSelected(event)">
    </div>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <button class="new-chat-btn" onclick="newChat()">＋ 新建对话</button>

  <div class="chat-list" id="chatList">
    <div class="section-title">📋 对话历史</div>
    <div class="no-chats" id="noChats">暂无历史对话</div>
  </div>

  <div class="sidebar-footer">
    <div class="status off" id="status">⚫ 未连接</div>
  </div>
</aside>

<!-- ════ 主聊天区 ════ -->
<div class="main">
  <div class="header">
    <h1 id="chatTitle">💬 新对话</h1>
    <span class="badge">RAG + SSE 流式</span>
  </div>

  <div class="messages" id="messages">
    <div class="msg ai">
      <div class="avatar">🤖</div>
      <div class="bubble">你好！我是 AI 知识库助手。<br>请先在左侧填入 API Key，然后输入你的问题。<br><br>我会从知识库中检索相关文档，结合上下文给你回答 ✨</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="输入你的问题… (Enter 发送，Shift+Enter 换行)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  SSE 流式聊天客户端（多会话版）
// ═══════════════════════════════════════════

const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
const STORAGE_KEY = 'rag_chat_api_key';
const CHATS_KEY = 'rag_chat_conversations';

// ── DOM 引用 ──
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const apiKeyEl = document.getElementById('apiKey');
const rememberEl = document.getElementById('rememberKey');
const forgetEl = document.getElementById('forgetKey');
const keySavedHint = document.getElementById('keySavedHint');
const chatListEl = document.getElementById('chatList');
const chatTitleEl = document.getElementById('chatTitle');
const noChatsEl = document.getElementById('noChats');
let isStreaming = false;

// ── 会话状态 ──
let conversations = [];       // [{id, title, messages: [], createdAt}]
let currentChatId = null;

// ── API Key 记忆 ──
function loadSavedKey() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    apiKeyEl.value = saved;
    rememberEl.checked = true;
    forgetEl.style.display = 'inline';
    keySavedHint.style.display = 'block';
  }
}
rememberEl.addEventListener('change', () => {
  if (rememberEl.checked && apiKeyEl.value.trim()) {
    localStorage.setItem(STORAGE_KEY, apiKeyEl.value.trim());
    forgetEl.style.display = 'inline';
  } else if (!rememberEl.checked) {
    localStorage.removeItem(STORAGE_KEY);
    forgetEl.style.display = 'none';
    keySavedHint.style.display = 'none';
  }
});
forgetEl.addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.removeItem(STORAGE_KEY);
  apiKeyEl.value = ''; rememberEl.checked = false;
  forgetEl.style.display = 'none'; keySavedHint.style.display = 'none';
});
apiKeyEl.addEventListener('input', () => {
  if (rememberEl.checked && apiKeyEl.value.trim()) {
    localStorage.setItem(STORAGE_KEY, apiKeyEl.value.trim());
  }
});

// ── 会话管理 ──
function loadConversations() {
  try {
    const raw = localStorage.getItem(CHATS_KEY);
    conversations = raw ? JSON.parse(raw) : [];
  } catch { conversations = []; }
}
function saveConversations() {
  localStorage.setItem(CHATS_KEY, JSON.stringify(conversations));
}

function newChat() {
  // 如果当前对话为空，不保存
  const current = getCurrentConv();
  if (current && current.messages.length === 0) return;

  // 如果当前对话有内容且还没保存，它已经在 conversations 里了
  currentChatId = null;
  renderMessages();
  chatTitleEl.textContent = '💬 新对话';
  refreshChatList();
}

function getCurrentConv() {
  if (!currentChatId) return null;
  return conversations.find(c => c.id === currentChatId) || null;
}

function ensureCurrentChat() {
  if (currentChatId) {
    const exists = conversations.find(c => c.id === currentChatId);
    if (exists) return;
    currentChatId = null;
  }
  // 创建一个新会话
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const conv = { id, title: '新对话', messages: [], createdAt: Date.now() };
  conversations.unshift(conv);
  currentChatId = id;
  chatTitleEl.textContent = '💬 新对话';
  saveConversations();
  refreshChatList();
}

function switchChat(id) {
  if (isStreaming) return; // 正在接收中不允许切换
  currentChatId = id;
  const conv = conversations.find(c => c.id === id);
  if (conv) {
    chatTitleEl.textContent = conv.title;
    renderMessages();
  }
  refreshChatList();
}

function deleteChat(id, e) {
  e.stopPropagation();
  conversations = conversations.filter(c => c.id !== id);
  if (currentChatId === id) {
    currentChatId = null;
    chatTitleEl.textContent = '💬 新对话';
    // 恢复到最新对话或空
    if (conversations.length > 0) {
      currentChatId = conversations[0].id;
      chatTitleEl.textContent = conversations[0].title;
    }
    renderMessages();
  }
  saveConversations();
  refreshChatList();
}

function renderMessages() {
  const conv = getCurrentConv();
  messagesEl.innerHTML = '';
  if (!conv || conv.messages.length === 0) {
    messagesEl.innerHTML = `
      <div class="msg ai">
        <div class="avatar">🤖</div>
        <div class="bubble">你好！我是 AI 知识库助手。<br>请先在左侧填入 API Key，然后输入你的问题。<br><br>我会从知识库中检索相关文档，结合上下文给你回答 ✨</div>
      </div>`;
    return;
  }
  conv.messages.forEach(m => {
    if (m.role === 'user') {
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerHTML = `<div class="avatar">👤</div><div class="bubble"></div>`;
      div.querySelector('.bubble').textContent = m.content;
      messagesEl.appendChild(div);
    } else {
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"></div>`;
      div.querySelector('.bubble').textContent = m.content;
      messagesEl.appendChild(div);
      if (m.sources && m.sources.length > 0) {
        const srcDiv = document.createElement('div');
        srcDiv.className = 'msg ai';
        let html = '<div class="avatar">📚</div><div class="sources"><div class="src-title">📎 检索到的来源文档</div>';
        m.sources.forEach(d => {
          html += `<div class="src-item">${escHtml((d.text||'').substring(0,80))}…<span class="src-dist">距离:${(d.distance||0).toFixed(3)}</span></div>`;
        });
        html += '</div>';
        srcDiv.innerHTML = html;
        messagesEl.appendChild(srcDiv);
      }
    }
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function refreshChatList() {
  const sectionTitle = chatListEl.querySelector('.section-title');
  chatListEl.innerHTML = '';
  chatListEl.appendChild(sectionTitle);

  if (conversations.length === 0) {
    chatListEl.innerHTML += '<div class="no-chats">暂无历史对话</div>';
    return;
  }

  conversations.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    const date = new Date(c.createdAt);
    const timeStr = date.toLocaleDateString('zh-CN', { month:'short', day:'numeric' }) + ' ' +
                    date.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    div.innerHTML = `
      <span class="icon">💬</span>
      <span class="info">
        <div class="title">${escHtml(c.title)}</div>
        <div class="time">${timeStr} · ${c.messages.length} 条消息</div>
      </span>
      <span class="delete-btn" title="删除">✕</span>
    `;
    div.onclick = () => switchChat(c.id);
    div.querySelector('.delete-btn').onclick = (e) => deleteChat(c.id, e);
    chatListEl.appendChild(div);
  });
}

function setStatus(state) {
  isStreaming = (state === 'streaming');
  sendBtn.disabled = isStreaming;
  inputEl.disabled = isStreaming;
  if (state === 'on')       { statusEl.textContent = '🟢 已连接'; statusEl.className = 'status on'; }
  else if (state === 'streaming') { statusEl.textContent = '🔵 接收中…'; statusEl.className = 'status on'; }
  else                      { statusEl.textContent = '⚫ 未连接'; statusEl.className = 'status off'; }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── 发送消息 ──
async function send() {
  const apiKey = apiKeyEl.value.trim();
  const userId = document.getElementById('userId').value.trim();
  const message = inputEl.value.trim();

  if (!apiKey) { alert('请先在左侧填入 API Key'); return; }
  if (!userId)  { alert('请填入用户 ID'); return; }
  if (!message) { alert('请输入消息'); return; }

  ensureCurrentChat();

  const conv = getCurrentConv();
  if (!conv) return;

  // 首条消息作为对话标题
  if (conv.messages.length === 0) {
    conv.title = message.length > 30 ? message.slice(0, 30) + '…' : message;
    chatTitleEl.textContent = conv.title;
  }

  // 保存用户消息
  conv.messages.push({ role: 'user', content: message });
  saveConversations();
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // 创建 AI 消息占位
  const aiMsg = { role: 'assistant', content: '', sources: null };
  conv.messages.push(aiMsg);
  refreshChatList();
  renderMessages();

  // 找到 AI bubble
  const allBubbles = messagesEl.querySelectorAll('.msg.ai .bubble');
  const aiBubble = allBubbles[allBubbles.length - 1];
  aiBubble.textContent = '思考中…';
  setStatus('streaming');

  try {
    const response = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
      body: JSON.stringify({ user_id: userId, message }),
    });

    if (!response.ok) {
      const errText = await response.text();
      aiBubble.textContent = `❌ 请求失败 (${response.status}): ${errText}`;
      aiBubble.style.color = '#e94560';
      aiMsg.content = aiBubble.textContent;
      saveConversations();
      setStatus('off');
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let firstChunk = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const lines = part.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);

          // 元数据事件（来源文档）
          if (payload.startsWith('{') && payload.includes('"type"')) {
            try {
              const meta = JSON.parse(payload);
              if (meta.type === 'sources' && meta.docs) {
                aiMsg.sources = meta.docs;
              }
            } catch(e) {}
            continue;
          }

          if (payload === '[ERROR]服务异常') {
            aiBubble.textContent += '\n\n⚠️ 服务端异常';
            aiBubble.style.color = '#ff9100';
            continue;
          }
          if (firstChunk) { aiBubble.textContent = ''; firstChunk = false; }
          aiBubble.textContent += payload;
        }
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    if (buffer.trim()) {
      for (const line of buffer.split('\n')) {
        if (line.startsWith('data: ') && line.slice(6) !== '[DONE]') {
          if (firstChunk) { aiBubble.textContent = ''; firstChunk = false; }
          aiBubble.textContent += line.slice(6);
        }
      }
    }
    if (firstChunk) { aiBubble.textContent = '（收到空响应）'; aiBubble.style.color = 'var(--text-dim)'; }

    aiMsg.content = aiBubble.textContent;
    saveConversations();
    refreshChatList();
    setStatus('on');
  } catch (err) {
    aiBubble.textContent = `❌ 网络错误: ${err.message}`;
    aiBubble.style.color = '#e94560';
    aiMsg.content = aiBubble.textContent;
    saveConversations();
    setStatus('off');
  } finally {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

// ── 启动 ──
loadSavedKey();
loadConversations();
refreshChatList();
if (conversations.length > 0) {
  currentChatId = conversations[0].id;
  chatTitleEl.textContent = conversations[0].title;
  renderMessages();
}

// 健康检查：页面加载时检测服务器是否可达
(async function checkHealth() {
  try {
    const resp = await fetch(API_BASE + '/health');
    if (resp.ok) {
      const data = await resp.json();
      setStatus('on');
      statusEl.textContent = '🟢 服务正常 (v' + (data.version || '?') + ')';
    } else {
      setStatus('off');
    }
  } catch {
    setStatus('off');
    statusEl.textContent = '🔴 无法连接服务器';
  }
})();

// ── 文件上传 ──
let selectedFile = null;

function onFileSelected(event) {
  selectedFile = event.target.files[0];
  if (!selectedFile) return;
  uploadFile();
}

async function uploadFile() {
  const apiKey = apiKeyEl.value.trim();
  if (!apiKey) { alert('请先在左侧填入 API Key'); return; }
  if (!selectedFile) return;

  const uploadArea = document.getElementById('uploadArea');
  const uploadStatus = document.getElementById('uploadStatus');

  uploadArea.classList.add('uploading');
  uploadStatus.textContent = '⏳ 正在上传并入库…';
  uploadStatus.className = 'upload-status loading';

  try {
    const formData = new FormData();
    formData.append('file', selectedFile);

    const response = await fetch(API_BASE + '/upload', {
      method: 'POST',
      headers: { 'X-API-Key': apiKey },
      body: formData,
    });

    const result = await response.json();

    if (response.ok) {
      uploadStatus.textContent = '✅ ' + result.filename + ' 入库成功！'
        + (result.replaced ? '(覆盖 ' + result.replaced_count + ' 条)' : '')
        + ' 新增 ' + result.chunks + ' 块';
      uploadStatus.className = 'upload-status success';
      setTimeout(() => { uploadStatus.className = 'upload-status'; }, 5000);
    } else {
      uploadStatus.textContent = '❌ ' + (result.detail || '上传失败');
      uploadStatus.className = 'upload-status error';
    }
  } catch (err) {
    uploadStatus.textContent = '❌ 网络错误: ' + err.message;
    uploadStatus.className = 'upload-status error';
  } finally {
    uploadArea.classList.remove('uploading');
    selectedFile = null;
    document.getElementById('fileInput').value = '';
  }
}
</script>
