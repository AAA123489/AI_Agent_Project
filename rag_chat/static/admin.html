<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理</title>
<style>
  :root {
    --bg: #1a1a2e; --sidebar-bg: #0d1117; --card: #161b22;
    --accent: #e94560; --text: #eee; --text-dim: #8b949e;
    --user-bubble: #1f2937; --ai-bubble: #0d1117;
    --input-bg: #161b22; --border: #30363d;
    --success: #3fb950; --warn: #d2991d;
    --hover: #1c2128;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }

  /* ════ 顶栏 ════ */
  .topbar {
    background: var(--sidebar-bg); border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .topbar h1 { font-size: 18px; color: var(--accent); }

  .unlock-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card);
    transition: border-color .2s, box-shadow .2s;
  }
  .unlock-bar.flash { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(233,69,96,.25); }
  .unlock-view { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.locked { background: #666; }
  .status-dot.unlocked { background: var(--success); }
  .status-text { color: var(--text-dim); }
  .unlock-bar input[type="password"] {
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; outline: none;
    width: 200px;
  }
  .unlock-bar input:focus { border-color: var(--accent); }
  .unlock-bar a { color: var(--text-dim); cursor: pointer; font-size: 12px; text-decoration: none; }
  .unlock-bar a:hover { color: var(--accent); }

  button {
    padding: 8px 18px; border-radius: 8px; border: none;
    font-size: 13px; cursor: pointer; transition: opacity .2s, background .2s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--border); color: var(--text); }

  /* ════ 主区域 ════ */
  .admin-main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 40px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-header h2 { font-size: 15px; color: var(--text); }
  .locked-hint { font-size: 11px; color: var(--warn); }

  /* ════ 统计 ════ */
  .stat-grid { display: flex; gap: 14px; margin-bottom: 14px; }
  .stat-tile {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .stat-num { font-size: 30px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--text-dim);
  }
  .chip b { color: var(--text); font-weight: 600; }

  /* ════ 爬虫 ════ */
  .scrape-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .scrape-controls label { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .scrape-controls input[type="number"] {
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; width: 70px; outline: none;
  }
  .scrape-controls input:focus { border-color: var(--accent); }
  .banner { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
  .banner-info { background: #1a1a00; color: var(--warn); }
  .banner-error { background: #3d0000; color: var(--accent); }
  .banner-success { background: #003d1a; color: var(--success); }
  .scrape-result { margin-top: 12px; font-size: 13px; }
  .scrape-result .stat-line { margin-bottom: 4px; }
  .scrape-result .err-list { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

  /* ════ 问答审计 ════ */
  .audit-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .audit-filters label {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 11px; color: var(--text-dim);
  }
  .audit-filters input, .audit-filters select {
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; outline: none;
  }
  .audit-filters input[type="number"] { width: 100px; }
  .audit-filters input[type="date"] { width: 150px; color-scheme: dark; }
  .audit-filters input:focus, .audit-filters select:focus { border-color: var(--accent); }
  .audit-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .audit-summary {
    font-size: 12px; color: var(--text-dim); margin: 14px 0 8px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap;
  }
  .audit-list { display: flex; flex-direction: column; gap: 6px; }
  .audit-row { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .audit-row[open] { border-color: #3d4450; }
  .audit-row > summary {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    cursor: pointer; font-size: 12px; list-style: none; user-select: none;
  }
  .audit-row > summary::-webkit-details-marker { display: none; }
  .audit-row > summary:hover { background: var(--hover); }
  .audit-time { color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .audit-user { color: #79c0ff; white-space: nowrap; }
  .audit-q { flex: 1; min-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audit-badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .audit-badge.done { background: #0d3321; color: var(--success); }
  .audit-badge.error { background: #3d0000; color: var(--accent); }
  .audit-badge.aborted { background: #332b00; color: var(--warn); }
  .audit-meta-small { color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .audit-detail { padding: 4px 14px 14px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.7; }
  .audit-detail h4 { font-size: 12px; color: var(--text-dim); margin: 12px 0 4px; font-weight: 600; }
  .audit-detail pre {
    background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; white-space: pre-wrap; word-break: break-word; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    max-height: 360px; overflow: auto;
  }
  .audit-detail ol { padding-left: 20px; }
  .audit-detail ol li { margin: 2px 0; }
  .audit-detail a { color: #79c0ff; }
  .audit-tool { background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .audit-tool-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .audit-tool-head b { color: var(--text); }
  .audit-tool-stats { color: var(--text-dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  .audit-tool pre { margin-top: 6px; max-height: 220px; }
  .audit-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 24px 0; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--text-dim); }
  .pager button { padding: 6px 14px; font-size: 12px; }

  /* ════ 确认弹窗（复用 chat.html 样式） ════ */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.65); z-index: 1000;
    justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; max-width: 420px; width: 90%;
    animation: fadeIn .2s ease;
  }
  .modal-box h3 { color: var(--accent); margin-bottom: 12px; font-size: 16px; }
  .modal-box p { font-size: 13px; color: var(--text-dim); line-height: 1.7; margin-bottom: 20px; }
  .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-buttons button {
    padding: 8px 18px; border-radius: 8px; border: none;
    font-size: 13px; cursor: pointer; transition: opacity .2s;
  }
  .modal-buttons button:hover { opacity: .85; }
  .modal-btn-cancel { background: var(--border); color: var(--text); }
  .modal-btn-confirm { background: var(--accent); color: #fff; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .pulse { animation: pulse 1.4s infinite; }

  /* ════ Toast ════ */
  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 2000;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #toast.show { opacity: 1; }
  #toast.ok { border-color: var(--success); color: var(--success); }
  #toast.err { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header class="topbar">
  <h1>📚 知识库管理</h1>
  <div class="unlock-bar" id="unlockBar">
    <div class="unlock-view" id="lockedView">
      <span class="status-dot locked"></span>
      <span class="status-text">未解锁</span>
      <input type="password" id="unlockInput" placeholder="服务端 API_KEY" autocomplete="off">
      <button class="btn-accent" id="unlockBtn">解锁</button>
      <span class="status-text" style="font-size:11px">填 .env 里的 API_KEY</span>
    </div>
    <div class="unlock-view" id="unlockedView" hidden>
      <span class="status-dot unlocked"></span>
      <span class="status-text" id="unlockStatusText">已解锁</span>
      <a id="reenterKey">重新输入</a>
      <a id="forgetKey">清除</a>
    </div>
  </div>
</header>

<main class="admin-main">
  <!-- 区块1：知识库概览（公开） -->
  <section class="card" id="statsSection">
    <div class="section-header">
      <h2>知识库概览</h2>
      <button class="btn-ghost" id="refreshStatsBtn">刷新</button>
    </div>
    <div class="banner banner-error" id="statsError" hidden></div>
    <div class="stat-grid">
      <div class="stat-tile"><div class="stat-num" id="statArticles">–</div><div class="stat-label">文章</div></div>
      <div class="stat-tile"><div class="stat-num" id="statChunks">–</div><div class="stat-label">分块</div></div>
    </div>
    <div class="chip-grid" id="categoryChips"></div>
  </section>

  <!-- 区块2：爬虫更新（需解锁） -->
  <section class="card" id="scrapeSection">
    <div class="section-header">
      <h2>爬虫更新</h2>
      <span class="locked-hint" id="scrapeLockedHint" hidden>⚠ 请先在上方解锁</span>
    </div>
    <div class="scrape-controls">
      <label>抓取页数
        <input type="number" id="scrapePages" min="1" max="10" value="2">
      </label>
      <button class="btn-accent" id="scrapeBtn">开始抓取</button>
    </div>
    <div class="banner banner-info" id="scrapeStatus" hidden>⏳ 运行中…（每页约 3~8 分钟，请耐心等待，此窗口勿关闭）</div>
    <div class="scrape-result" id="scrapeResult" hidden></div>
  </section>

  <!-- 区块3：问答审计（需解锁） -->
  <section class="card" id="auditSection">
    <div class="section-header">
      <h2>问答审计</h2>
      <span class="locked-hint" id="auditLockedHint" hidden>⚠ 请先在上方解锁</span>
    </div>
    <div class="audit-filters">
      <label>用户 ID
        <input type="number" id="auditUserId" min="1" placeholder="全部">
      </label>
      <label>开始日期
        <input type="date" id="auditFrom">
      </label>
      <label>结束日期
        <input type="date" id="auditTo">
      </label>
      <label>状态
        <select id="auditStatus">
          <option value="">全部</option>
          <option value="done">done</option>
          <option value="error">error</option>
          <option value="aborted">aborted</option>
        </select>
      </label>
      <div class="audit-actions">
        <button class="btn-accent" id="auditQueryBtn">查询</button>
        <button class="btn-ghost" id="auditExportCsvBtn">导出 CSV</button>
        <button class="btn-ghost" id="auditExportJsonlBtn">导出 JSONL</button>
      </div>
    </div>
    <div class="banner banner-error" id="auditError" hidden></div>
    <div class="audit-summary" id="auditSummary" hidden>
      <span id="auditSummaryText"></span>
    </div>
    <div class="audit-list" id="auditList"></div>
    <div class="pager" id="auditPager" hidden>
      <button class="btn-ghost" id="auditPrevBtn">上一页</button>
      <span id="auditPageInfo"></span>
      <button class="btn-ghost" id="auditNextBtn">下一页</button>
    </div>
  </section>
</main>

<!-- 爬虫确认弹窗 -->
<div class="modal-overlay" id="scrapeConfirmModal">
  <div class="modal-box">
    <h3>确认开始抓取？</h3>
    <p id="scrapeConfirmText">将从官网抓取 N 页，每页约 3~8 分钟。抓取期间请勿关闭本页面，等待期间可刷新上方知识库概览观察篇数增长。</p>
    <div class="modal-buttons">
      <button class="modal-btn-cancel" id="scrapeCancelBtn">取消</button>
      <button class="modal-btn-confirm" id="scrapeConfirmBtn">✓ 开始</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════
// 常量与状态
// ═══════════════════════════════════════
const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
const KEY_STORAGE = 'rag_admin_api_key';

let currentKey = '';
let globalBusy = false;
let toastTimer = null;

const $ = id => document.getElementById(id);

// ═══════════════════════════════════════
// 解锁
// ═══════════════════════════════════════
function maskKey(key) {
  return key.length > 4 ? key.slice(0, 4) + '…' + key.slice(-4) : 'sk…';
}

function setUnlockedState(unlocked) {
  $('lockedView').hidden = unlocked;
  $('unlockedView').hidden = !unlocked;
  if (unlocked) $('unlockStatusText').textContent = '已解锁 · ' + maskKey(currentKey);
}

function loadSavedKey() {
  const saved = localStorage.getItem(KEY_STORAGE);
  if (saved) {
    currentKey = saved;
    setUnlockedState(true);
  }
}

function handleUnlock() {
  const val = $('unlockInput').value.trim();
  if (!val) { $('unlockInput').focus(); return; }
  currentKey = val;
  localStorage.setItem(KEY_STORAGE, val);
  setUnlockedState(true);
  $('unlockInput').value = '';
  showToast('已解锁', 'ok');
  auditOffset = 0;
  fetchAudit();
}

function handleReenter() {
  currentKey = '';
  setUnlockedState(false);
  clearAuditView();
  $('unlockInput').focus();
}

function handleForget() {
  currentKey = '';
  localStorage.removeItem(KEY_STORAGE);
  setUnlockedState(false);
  clearAuditView();
}

function flashUnlock() {
  const bar = $('unlockBar');
  bar.classList.add('flash');
  bar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  setTimeout(() => bar.classList.remove('flash'), 2500);
}

function requireUnlocked() {
  if (currentKey) return true;
  flashUnlock();
  ['scrapeLockedHint', 'auditLockedHint'].forEach(id => {
    const hint = $(id);
    if (!hint) return;
    hint.hidden = false;
    setTimeout(() => { hint.hidden = true; }, 2500);
  });
  return false;
}

function handleApi401() {
  currentKey = '';
  setUnlockedState(false);
  clearAuditView();
  showToast('API Key 无效，请重新解锁', 'err');
}

function showToast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = type || '';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════
// 知识库概览（公开接口）
// ═══════════════════════════════════════
async function fetchKbStats() {
  $('statsError').hidden = true;
  try {
    const res = await fetch(API_BASE + '/kb-stats');
    if (!res.ok) {
      let detail = '加载失败';
      try { detail = (await res.json()).detail || detail; } catch (e) {}
      renderStatsError(detail);
      return;
    }
    renderStats(await res.json());
  } catch (err) {
    renderStatsError('无法连接服务，请确认 app_fastapi.py 已启动');
  }
}

function renderStats(data) {
  $('statArticles').textContent = data.total_articles ?? '–';
  $('statChunks').textContent = data.total_chunks ?? '–';
  const chips = $('categoryChips');
  chips.textContent = '';
  const counts = data.category_counts || {};
  Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .forEach(([cat, n]) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const b = document.createElement('b');
      b.textContent = n;
      chip.append(cat + ' ', b, ' 篇');
      chips.appendChild(chip);
    });
}

function renderStatsError(msg) {
  const e = $('statsError');
  e.textContent = '⚠ ' + msg;
  e.hidden = false;
}

// ═══════════════════════════════════════
// 爬虫更新
// ═══════════════════════════════════════
function openScrapeConfirm() {
  if (globalBusy) return;
  if (!requireUnlocked()) return;
  let pages = parseInt($('scrapePages').value, 10);
  if (!pages || pages < 1) pages = 1;
  if (pages > 10) pages = 10;
  $('scrapePages').value = pages;
  $('scrapeConfirmText').textContent =
    `将从官网抓取 ${pages} 页，每页约 3~8 分钟。抓取期间请勿关闭本页面，等待期间可刷新上方知识库概览观察篇数增长。`;
  $('scrapeConfirmModal').classList.add('show');
}

function closeScrapeConfirm() {
  $('scrapeConfirmModal').classList.remove('show');
}

async function scrapeNow(pages) {
  const res = await fetch(API_BASE + '/scrape/start?pages=' + pages, {
    method: 'POST',
    headers: { 'X-API-Key': currentKey },
  });
  if (res.status === 401) throw Object.assign(new Error('KEY_INVALID'), { code: 'KEY_INVALID' });
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (res.status === 200) return { ok: true, articles: body.total_articles, chunks: body.total_chunks, errors: body.errors || [] };
  return { failed: body.detail || ('爬取失败 (' + res.status + ')') };
}

async function startScrape() {
  closeScrapeConfirm();
  globalBusy = true;
  const scrapeBtn = $('scrapeBtn');
  scrapeBtn.disabled = true;
  scrapeBtn.textContent = '⏳ 运行中…';
  $('scrapeStatus').hidden = false;
  $('scrapeStatus').classList.add('pulse');
  $('scrapeResult').hidden = true;

  const pages = parseInt($('scrapePages').value, 10) || 2;
  let result;
  try {
    result = await scrapeNow(pages);
  } catch (err) {
    result = err.code === 'KEY_INVALID' ? { keyInvalid: true } : { failed: '无法连接服务' };
  }

  globalBusy = false;
  scrapeBtn.disabled = false;
  scrapeBtn.textContent = '开始抓取';
  $('scrapeStatus').hidden = true;
  $('scrapeStatus').classList.remove('pulse');

  const out = $('scrapeResult');
  out.hidden = false;
  out.textContent = '';

  if (result.keyInvalid) {
    const b = document.createElement('div');
    b.className = 'banner banner-error';
    b.textContent = '❌ API Key 无效';
    out.appendChild(b);
    handleApi401();
    return;
  }
  if (result.failed) {
    const b = document.createElement('div');
    b.className = 'banner banner-error';
    b.textContent = '❌ ' + result.failed;
    out.appendChild(b);
    return;
  }

  const line = document.createElement('div');
  line.className = 'stat-line';
  line.innerHTML = '';
  line.append('✅ 抓取完成：新增文章 ');
  const a = document.createElement('b'); a.textContent = result.articles ?? 0;
  const c = document.createElement('b'); c.textContent = result.chunks ?? 0;
  line.append(a, ' 篇 / ', c, ' 块');
  out.appendChild(line);

  if (result.errors && result.errors.length) {
    const errList = document.createElement('div');
    errList.className = 'err-list';
    errList.textContent = '部分文件出错：' + result.errors.slice(0, 5).join('；');
    out.appendChild(errList);
  }
  fetchKbStats();
}

// ═══════════════════════════════════════
// 问答审计
// ═══════════════════════════════════════
const AUDIT_PAGE_SIZE = 20;
let auditOffset = 0;
let auditTotal = 0;
let auditBusy = false;

function mk(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function clearAuditView() {
  auditOffset = 0;
  auditTotal = 0;
  $('auditList').textContent = '';
  $('auditSummary').hidden = true;
  $('auditPager').hidden = true;
  $('auditError').hidden = true;
}

function showAuditError(msg) {
  const banner = $('auditError');
  banner.textContent = '⚠ ' + msg;
  banner.hidden = false;
}

function auditFilterParams() {
  const params = new URLSearchParams();
  const userId = $('auditUserId').value.trim();
  if (userId) params.set('user_id', userId);
  if ($('auditFrom').value) params.set('date_from', $('auditFrom').value);
  if ($('auditTo').value) params.set('date_to', $('auditTo').value);
  if ($('auditStatus').value) params.set('status', $('auditStatus').value);
  return params;
}

async function fetchAudit() {
  if (auditBusy) return;
  if (!requireUnlocked()) return;

  auditBusy = true;
  const btn = $('auditQueryBtn');
  btn.disabled = true;
  btn.textContent = '查询中…';
  $('auditError').hidden = true;

  const params = auditFilterParams();
  params.set('limit', AUDIT_PAGE_SIZE);
  params.set('offset', auditOffset);

  try {
    const res = await fetch(API_BASE + '/admin/audit?' + params.toString(), {
      headers: { 'X-API-Key': currentKey },
    });
    if (res.status === 401) {
      handleApi401();
      return;
    }
    let body = {};
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) {
      const detail = typeof body.detail === 'string'
        ? body.detail
        : '参数不合法，请检查筛选条件';
      showAuditError(detail || ('加载失败 (' + res.status + ')'));
      return;
    }
    renderAudit(body);
  } catch (err) {
    showAuditError('无法连接服务，请确认 app_fastapi.py 已启动');
  } finally {
    auditBusy = false;
    btn.disabled = false;
    btn.textContent = '查询';
  }
}

function renderAudit(data) {
  const items = data.items || [];
  auditTotal = Number(data.total) || 0;

  const list = $('auditList');
  list.textContent = '';

  if (!items.length) {
    const empty = mk('div', 'audit-empty',
      auditOffset > 0 ? '这一页没有记录' : '暂无符合条件的问答记录');
    list.appendChild(empty);
  } else {
    items.forEach(item => list.appendChild(renderAuditRow(item)));
  }

  const start = auditTotal ? auditOffset + 1 : 0;
  const end = auditOffset + items.length;
  $('auditSummary').hidden = false;
  $('auditSummaryText').textContent = `共 ${auditTotal} 条 · 当前显示第 ${start}–${end} 条`;

  const pages = Math.max(1, Math.ceil(auditTotal / AUDIT_PAGE_SIZE));
  $('auditPager').hidden = auditTotal <= AUDIT_PAGE_SIZE;
  $('auditPageInfo').textContent = `第 ${Math.floor(auditOffset / AUDIT_PAGE_SIZE) + 1} / ${pages} 页`;
  $('auditPrevBtn').disabled = auditOffset <= 0;
  $('auditNextBtn').disabled = end >= auditTotal;
}

function renderAuditRow(item) {
  const row = document.createElement('details');
  row.className = 'audit-row';

  const summary = document.createElement('summary');

  const status = item.status || 'aborted';
  const time = (item.created_at || '').replace('T', ' ').slice(0, 19);

  summary.appendChild(mk('span', 'audit-time', time || '–'));
  summary.appendChild(mk('span', 'audit-user', `${item.username || '?'} #${item.user_id}`));
  summary.appendChild(mk('span', 'audit-q', item.question || '（空问题）'));
  summary.appendChild(mk('span', 'audit-badge ' + status, status));
  summary.appendChild(mk('span', 'audit-meta-small', (item.latency_ms ?? 0) + ' ms'));
  summary.appendChild(mk('span', 'audit-meta-small', item.mode || 'live'));
  row.appendChild(summary);

  const detail = mk('div', 'audit-detail');

  detail.appendChild(mk('h4', null, '问题'));
  detail.appendChild(mk('pre', null, item.question || '（空）'));

  detail.appendChild(mk('h4', null, '答案'));
  detail.appendChild(mk('pre', null, item.answer || '（空）'));

  const thinking = Array.isArray(item.thinking) ? item.thinking : [];
  if (thinking.length) {
    detail.appendChild(mk('h4', null, `思考过程（${thinking.length} 步）`));
    const ol = document.createElement('ol');
    thinking.forEach(step => ol.appendChild(mk('li', null, step)));
    detail.appendChild(ol);
  }

  const calls = Array.isArray(item.tool_calls) ? item.tool_calls : [];
  if (calls.length) {
    detail.appendChild(mk('h4', null, `工具调用（${calls.length} 次）`));
    calls.forEach(call => detail.appendChild(renderToolCall(call)));
  }

  const sources = Array.isArray(item.sources) ? item.sources : [];
  if (sources.length) {
    detail.appendChild(mk('h4', null, `来源（${sources.length}）`));
    const ol = document.createElement('ol');
    sources.forEach(src => {
      const li = document.createElement('li');
      const label = src.title || src.source || src.url || JSON.stringify(src);
      if (src.url) {
        const a = mk('a', null, label);
        a.href = src.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        li.appendChild(a);
      } else {
        li.textContent = label;
      }
      if (src.similarity !== undefined && src.similarity !== null) {
        li.append(`（相似度 ${Number(src.similarity).toFixed(3)}）`);
      }
      ol.appendChild(li);
    });
    detail.appendChild(ol);
  }

  if (item.error) {
    detail.appendChild(mk('h4', null, '错误'));
    detail.appendChild(mk('pre', null, item.error));
  }

  detail.appendChild(mk('h4', null, '元信息'));
  detail.appendChild(mk('pre', null, [
    `request_id: ${item.request_id || '–'}`,
    `conversation_id: ${item.conversation_id || '–'}`,
    `model: ${item.model || '–'}`,
    `mode: ${item.mode || '–'} / status: ${status}`,
    `latency: ${item.latency_ms ?? 0} ms`,
    `created_at: ${item.created_at || '–'}`,
  ].join('\n')));

  row.appendChild(detail);
  return row;
}

function renderToolCall(call) {
  const box = mk('div', 'audit-tool');
  const head = mk('div', 'audit-tool-head');

  head.appendChild(mk('b', null, call.tool || '未知工具'));
  head.appendChild(mk('span', 'audit-badge ' + (call.success ? 'done' : 'error'),
    call.success ? '✓ 成功' : '✗ 失败'));
  if (call.truncated) head.appendChild(mk('span', 'audit-badge aborted', '已截断'));
  head.appendChild(mk('span', 'audit-tool-stats', (call.duration_ms ?? 0) + ' ms'));
  box.appendChild(head);

  if (call.args) {
    box.appendChild(mk('h4', null, '参数'));
    box.appendChild(mk('pre', null, prettyJson(call.args)));
  }
  if (call.output) {
    box.appendChild(mk('h4', null, '结果'));
    box.appendChild(mk('pre', null, call.output));
  }
  return box;
}

function prettyJson(value) {
  if (typeof value !== 'string') return JSON.stringify(value, null, 2);
  try {
    return JSON.stringify(JSON.parse(value), null, 2);
  } catch (e) {
    return value;
  }
}

async function exportAudit(fmt) {
  if (!requireUnlocked()) return;

  const params = auditFilterParams();
  params.set('fmt', fmt);

  try {
    const res = await fetch(API_BASE + '/admin/audit/export?' + params.toString(), {
      headers: { 'X-API-Key': currentKey },
    });
    if (res.status === 401) {
      handleApi401();
      return;
    }
    if (!res.ok) {
      let detail = `导出失败 (${res.status})`;
      try {
        const body = await res.json();
        if (typeof body.detail === 'string') detail = body.detail;
      } catch (e) {}
      showAuditError(detail);
      return;
    }

    const blob = await res.blob();
    let filename = `qa_audit.${fmt}`;
    const disposition = res.headers.get('Content-Disposition') || '';
    const matched = disposition.match(/filename="?([^";]+)"?/);
    if (matched) filename = matched[1];

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('已导出 ' + fmt.toUpperCase(), 'ok');
  } catch (err) {
    showAuditError('导出失败：无法连接服务');
  }
}

// ═══════════════════════════════════════
// 事件绑定
// ═══════════════════════════════════════
$('unlockBtn').addEventListener('click', handleUnlock);
$('unlockInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleUnlock(); });
$('reenterKey').addEventListener('click', handleReenter);
$('forgetKey').addEventListener('click', handleForget);
$('refreshStatsBtn').addEventListener('click', fetchKbStats);
$('scrapeBtn').addEventListener('click', openScrapeConfirm);
$('scrapeCancelBtn').addEventListener('click', closeScrapeConfirm);
$('scrapeConfirmBtn').addEventListener('click', startScrape);
$('scrapeConfirmModal').addEventListener('click', e => { if (e.target === $('scrapeConfirmModal')) closeScrapeConfirm(); });

$('auditQueryBtn').addEventListener('click', () => { auditOffset = 0; fetchAudit(); });
$('auditPrevBtn').addEventListener('click', () => {
  if (auditOffset <= 0) return;
  auditOffset = Math.max(0, auditOffset - AUDIT_PAGE_SIZE);
  fetchAudit();
});
$('auditNextBtn').addEventListener('click', () => {
  if (auditOffset + AUDIT_PAGE_SIZE >= auditTotal) return;
  auditOffset += AUDIT_PAGE_SIZE;
  fetchAudit();
});
['auditUserId', 'auditFrom', 'auditTo', 'auditStatus'].forEach(id => {
  $(id).addEventListener('change', () => { auditOffset = 0; });
});
$('auditUserId').addEventListener('keydown', e => {
  if (e.key === 'Enter') { auditOffset = 0; fetchAudit(); }
});
$('auditExportCsvBtn').addEventListener('click', () => exportAudit('csv'));
$('auditExportJsonlBtn').addEventListener('click', () => exportAudit('jsonl'));

// 启动
loadSavedKey();
fetchKbStats();
if (currentKey) fetchAudit();
</script>
